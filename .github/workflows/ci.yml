name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx eslint .
      # Before the tests: some of them assert on generated output (the service
      # worker and its precache list), so a suite that runs first is asserting
      # on whatever dist happened to be lying around.
      - run: npm run build
      - run: npx vitest run
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: End-to-end smoke
        run: npx playwright test e2e --project=chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
